name: check
# Fast native build and test of Foreman's own code (no QNX, no secrets): safe for pull requests.
on:
  push:
  pull_request:
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j4
      - name: Test
        run: ci/test-native.sh
